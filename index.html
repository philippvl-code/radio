<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radio Live</title>
  <meta name="description" content="Live camera with visuals driven by NTS Radio.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500&display=swap">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <header>
    <h1>Radio Live</h1>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Connecting…</span></div>
  </header>

  <main class="viewer">
    <div class="stage">
      <video id="video" autoplay playsinline muted></video>
      <div class="placeholder" id="placeholder">Waiting for the stream…</div>
      <button class="unmute" id="unmute" hidden>Tap for sound</button>
    </div>
    <div class="np" id="np"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="config.js?v=2"></script>
  <script src="nts.js?v=2"></script>
  <script>
    const video = document.getElementById("video");
    const placeholder = document.getElementById("placeholder");
    const unmute = document.getElementById("unmute");
    const status = document.getElementById("status");
    const statusText = document.getElementById("statusText");
    const npEl = document.getElementById("np");

    function setStatus(text, live) { statusText.textContent = text; status.classList.toggle("live", !!live); }

    // What's on, for the channel the studio is playing.
    let channel = null, shows = null;
    const time = s => s ? new Date(s).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "";
    function renderNowPlaying() {
      const now = channel && shows && shows[String(channel)] && shows[String(channel)].now;
      npEl.innerHTML = "";
      if (!now) return;
      if (now.image) npEl.append(Object.assign(document.createElement("img"), { src: now.image, alt: "" }));
      const div = document.createElement("div");
      const b = document.createElement("b");
      b.textContent = now.title;
      const link = Object.assign(document.createElement("a"), { href: now.url, target: "_blank", rel: "noopener", textContent: "Listen on NTS" });
      div.append(b, `NTS ${channel} · ${time(now.start)}–${time(now.end)}${now.location ? " · " + now.location : ""} · `, link);
      npEl.append(div);
    }
    async function refreshShows() {
      try { shows = await NTS.live(); } catch (e) { console.warn(e); }
      renderNowPlaying();
    }
    refreshShows();
    setInterval(refreshShows, 60000);

    // Browsers only allow sound after a tap, so start muted and offer one.
    unmute.addEventListener("click", () => { video.muted = false; video.play(); unmute.hidden = true; });

    function showOffline() {
      video.srcObject = null;
      unmute.hidden = true;
      placeholder.hidden = false;
      placeholder.textContent = "Off air right now. This page reconnects on its own.";
      setStatus("Offline");
    }

    const musicSdp = sdp => sdp.replace(/useinbandfec=1/g, "useinbandfec=1;stereo=1;sprop-stereo=1;maxaveragebitrate=256000");
    const peer = new Peer();
    let retryTimer = null;

    function connect() {
      clearTimeout(retryTimer);
      setStatus("Connecting…");
      const conn = peer.connect(STREAM_ID, { reliable: true });
      conn.on("data", msg => {
        if (msg && msg.type === "station") { channel = msg.channel; renderNowPlaying(); }
      });
      conn.on("close", () => { showOffline(); scheduleRetry(); });
      conn.on("error", () => { showOffline(); scheduleRetry(); });
    }
    function scheduleRetry() { clearTimeout(retryTimer); retryTimer = setTimeout(connect, 5000); }

    peer.on("open", connect);
    peer.on("call", call => {
      call.answer(undefined, { sdpTransform: musicSdp });
      call.on("stream", stream => {
        video.srcObject = stream;
        placeholder.hidden = true;
        unmute.hidden = !video.muted;
        setStatus("Live", true);
      });
      call.on("close", () => { showOffline(); scheduleRetry(); });
    });
    peer.on("error", err => {
      if (err.type === "peer-unavailable") showOffline();
      else setStatus("Error: " + err.type);
      scheduleRetry();
    });
    peer.on("disconnected", () => peer.reconnect());
  </script>
</body>
</html>
