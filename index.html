<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radio Live</title>
  <meta name="description" content="Live camera with visuals driven by NTS Radio.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500&display=swap">
  <link rel="stylesheet" href="style.css?v=14">
</head>
<body>
  <header>
    <h1>Radio Live</h1>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Connecting…</span></div>
  </header>

  <main class="viewer">
    <div class="stage">
      <video id="video" autoplay playsinline muted></video>
      <div class="placeholder" id="placeholder">Waiting for the stream…</div>
      <button class="unmute" id="unmute" hidden>Tap for sound</button>
      <button class="fs-btn" id="fsBtn">Full screen</button>
    </div>
    <div class="np" id="np"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="config.js?v=14"></script>
  <script src="nts.js?v=14"></script>
  <script src="fullscreen.js?v=14"></script>
  <script src="youtube.js?v=14"></script>
  <script>
    const video = document.getElementById("video");
    const placeholder = document.getElementById("placeholder");
    const unmute = document.getElementById("unmute");
    const status = document.getElementById("status");
    const statusText = document.getElementById("statusText");
    const npEl = document.getElementById("np");
    setupFullscreen(document.querySelector(".stage"), document.getElementById("fsBtn"), video);
    const yt = createYouTubeLayer(document.querySelector(".stage"));
    let ytLast = null;

    function setStatus(text, live) { statusText.textContent = text; status.classList.toggle("live", !!live); }

    // What's on, for the channel the studio is playing.
    let channel = null, shows = null;
    const time = s => s ? new Date(s).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "";
    function renderNowPlaying() {
      const now = channel && shows && shows[String(channel)] && shows[String(channel)].now;
      npEl.innerHTML = "";
      if (!now) return;
      if (now.image) npEl.append(Object.assign(document.createElement("img"), { src: now.image, alt: "" }));
      const div = document.createElement("div");
      const b = document.createElement("b");
      b.textContent = now.title;
      const link = Object.assign(document.createElement("a"), { href: now.url, target: "_blank", rel: "noopener", textContent: "Listen on NTS" });
      div.append(b, `NTS ${channel} · ${time(now.start)}–${time(now.end)}${now.location ? " · " + now.location : ""} · `, link);
      npEl.append(div);
    }
    async function refreshShows() {
      try { shows = await NTS.live(); } catch (e) { console.warn(e); }
      renderNowPlaying();
    }
    refreshShows();
    setInterval(refreshShows, 60000);

    // Browsers only allow sound after a tap, so start muted and offer one.
    unmute.addEventListener("click", () => {
      video.muted = false;
      video.play();
      unmute.hidden = true;
      if (ytLast) yt.apply({ ...ytLast, on: ytLast.on && !!video.srcObject }, ytLast.time); // a tap also lets the overlay start
    });

    function showOffline() {
      video.srcObject = null;
      if (ytLast) yt.apply({ ...ytLast, on: false });
      unmute.hidden = true;
      placeholder.hidden = false;
      placeholder.textContent = "Off air right now. This page reconnects on its own.";
      setStatus("Offline");
    }

    const musicSdp = sdp => sdp.replace(/useinbandfec=1/g, "useinbandfec=1;stereo=1;sprop-stereo=1;maxaveragebitrate=256000");
    const peer = new Peer();
    let retryTimer = null, offlineTimer = null, conns = [], liveCall = null;

    function onData(msg) {
      if (!msg) return;
      if (msg.type === "station") { channel = msg.channel; renderNowPlaying(); }
      if (msg.type === "yt") { ytLast = msg; yt.apply({ ...msg, on: msg.on && !!video.srcObject }, msg.time); }
    }

    // The studio registers under the first free ID in STREAM_IDS, so knock on all of them
    // and watch whichever studio calls back. Nobody calling within 8 s means off air.
    function connect() {
      clearTimeout(retryTimer);
      setStatus("Connecting…");
      conns.forEach(c => c.close());
      conns = STREAM_IDS.map(id => {
        const conn = peer.connect(id, { reliable: true });
        conn.on("data", onData);
        conn.on("close", () => { if (liveCall && liveCall.peer === conn.peer) dropLive(); });
        return conn;
      });
      clearTimeout(offlineTimer);
      offlineTimer = setTimeout(() => { if (!liveCall) { showOffline(); scheduleRetry(); } }, 8000);
    }
    function scheduleRetry() { clearTimeout(retryTimer); retryTimer = setTimeout(connect, 5000); }
    function dropLive() {
      if (liveCall) liveCall.close();
      liveCall = null;
      showOffline();
      scheduleRetry();
    }

    peer.on("open", connect);
    peer.on("call", call => {
      if (liveCall) return call.close(); // already watching a studio
      liveCall = call;
      conns.filter(c => c.peer !== call.peer).forEach(c => c.close());
      call.answer(undefined, { sdpTransform: musicSdp });
      call.on("stream", stream => {
        video.srcObject = stream;
        placeholder.hidden = true;
        unmute.hidden = !video.muted;
        setStatus("Live", true);
        if (ytLast) yt.apply(ytLast, ytLast.time);
      });
      call.on("close", () => { if (liveCall === call) dropLive(); });
    });
    peer.on("error", err => {
      if (err.type === "peer-unavailable") return; // that slot is empty; the timer decides
      setStatus("Error: " + err.type);
      scheduleRetry();
    });
    peer.on("disconnected", () => peer.reconnect());
  </script>
</body>
</html>
